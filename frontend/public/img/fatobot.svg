<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260">
  <defs>
    <linearGradient id="casco" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2a44"/><stop offset="1" stop-color="#060c18"/></linearGradient>
    <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <g filter="url(#sombra)">
    <!-- antena -->
    <path d="M100 30v20" stroke="#e9eef4" stroke-width="8" stroke-linecap="round"/><circle cx="100" cy="24" r="9" fill="#fff"/>
    <!-- corpo -->
    <rect x="58" y="150" width="84" height="74" rx="34" fill="url(#casco)"/>
    <circle cx="100" cy="186" r="12" fill="#bfe9ff" stroke="#4fa3ff" stroke-width="3"/>
    <!-- pernas -->
    <rect x="70" y="214" width="22" height="32" rx="10" fill="url(#casco)"/><rect x="108" y="214" width="22" height="32" rx="10" fill="url(#casco)"/>
    <ellipse cx="81" cy="248" rx="14" ry="7" fill="#2b3f5c"/><ellipse cx="119" cy="248" rx="14" ry="7" fill="#2b3f5c"/>
    <!-- braço esquerdo -->
    <rect x="34" y="158" width="26" height="54" rx="13" fill="url(#casco)" transform="rotate(14 47 160)"/>
    <circle cx="40" cy="214" r="11" fill="#2b3f5c"/>
    <!-- braço direito acenando -->
    <rect x="140" y="112" width="26" height="58" rx="13" fill="url(#casco)" transform="rotate(28 153 168)"/>
    <circle cx="178" cy="114" r="13" fill="#2b3f5c"/>
    <!-- cabeça -->
    <rect x="26" y="78" width="20" height="44" rx="10" fill="#4fa3ff"/><rect x="154" y="78" width="20" height="44" rx="10" fill="#4fa3ff"/>
    <rect x="36" y="44" width="128" height="112" rx="50" fill="url(#casco)"/>
    <rect x="52" y="70" width="96" height="62" rx="28" fill="url(#visor)"/>
    <g fill="#3fe0ff"><circle cx="80" cy="99" r="13" filter="url(#brilho)" opacity=".7"/><circle cx="120" cy="99" r="13" filter="url(#brilho)" opacity=".7"/>
      <circle cx="80" cy="99" r="10"/><circle cx="120" cy="99" r="10"/></g>
    <path d="M90 118q10 7 20 0" fill="none" stroke="#3fe0ff" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="76" cy="56" rx="20" ry="6" fill="#fff" opacity=".85"/>
  </g>
</svg>
